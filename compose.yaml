services:
  strata:
    image: deepseek-v4.1-flash:strata-1017-exl3
    build:
      context: .
      dockerfile: deployment/Dockerfile
    network_mode: host
    init: true
    restart: "no"
    stop_grace_period: 60s
    mem_limit: 24g
    memswap_limit: 24g
    environment:
      STRATA_DATA_DIR: ${STRATA_DATA_DIR:?Set an absolute STRATA_DATA_DIR in .env}
      DS41_CUDA_VISIBLE_DEVICES: ${DS41_CUDA_VISIBLE_DEVICES:-0,1}
      DS41_TELEMETRY_GPUS: ${DS41_TELEMETRY_GPUS:-0,1}
      DS41_PORT: "8081"
      DS41_SPEC: ${DS41_SPEC:-none}
      DS41_PARALLEL: ${DS41_PARALLEL:-1}
    devices:
      - nvidia.com/gpu=0
      - nvidia.com/gpu=1
    volumes:
      - type: bind
        source: ${STRATA_DATA_DIR}/models/sudoingx-DeepSeek-V4.1-Flash-1017-EXL3-2.7bpw
        target: ${STRATA_DATA_DIR}/models/sudoingx-DeepSeek-V4.1-Flash-1017-EXL3-2.7bpw
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${STRATA_DATA_DIR}/packs/sudoingx-1017-22205b9a-EXL3-2.7bpw-dspark
        target: ${STRATA_DATA_DIR}/packs/sudoingx-1017-22205b9a-EXL3-2.7bpw-dspark
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./logs
        target: /opt/strata/logs
        bind:
          create_host_path: false
