services:
  maya:
    image: deepseek-v4.1-flash:maya-1017-exl3
    build:
      context: .
      dockerfile: deployment/Dockerfile
      additional_contexts:
        maya: ${MAYA_SOURCE_DIR:?Set the pinned Maya checkout in .env}
    network_mode: host
    init: true
    restart: "no"
    stop_grace_period: 60s
    mem_limit: 32g
    memswap_limit: 32g
    environment:
      STRATA_DATA_DIR: ${STRATA_DATA_DIR:?Set an absolute STRATA_DATA_DIR in .env}
      MAYA_PACK_DIR: ${MAYA_PACK_DIR:?Set the existing Maya pack in .env}
      DS41_CUDA_VISIBLE_DEVICES: ${DS41_CUDA_VISIBLE_DEVICES:-0,1}
      DS41_PORT: ${DS41_PORT:-8081}
      MAYA_CONTEXT: ${MAYA_CONTEXT:-32768}
      MAYA_SPEC: ${MAYA_SPEC:-on}
      STRATA_API_KEY: ${STRATA_API_KEY:-}
    devices:
      - nvidia.com/gpu=0
      - nvidia.com/gpu=1
    volumes:
      - type: bind
        source: ${STRATA_DATA_DIR}/models
        target: ${STRATA_DATA_DIR}/models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${STRATA_DATA_DIR}/packs
        target: ${STRATA_DATA_DIR}/packs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./logs
        target: /opt/deployment/logs
        bind:
          create_host_path: false
